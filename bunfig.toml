# Generated by pob: do not edit, it is overwritten on each pob run.
[install]
# Only install package versions published at least 2.5 days ago
minimumReleaseAge = 216000 # seconds
minimumReleaseAgeExcludes = [
  "@pob/codemods",
  "@pob/commitlint-config",
  "@pob/esbuild",
  "@pob/eslint-config",
  "@pob/eslint-config-typescript",
  "@pob/eslint-config-typescript-react",
  "@pob/eslint-plugin",
  "@pob/pretty-pkg",
  "@pob/rollup",
  "@pob/rollup-esbuild",
  "@pob/rollup-typescript",
  "@pob/root",
  "@pob/sort-object",
  "@pob/sort-pkg",
  "@pob/version",
  "pob",
  "pob-dependencies",
  "check-package-dependencies",
  "alouette",
  "alouette-icons",
  "nightingale",
  "nightingale-logger",
  "nightingale-levels",
  "nightingale-types",
]

[test]
# dist is build output: its compiled *.test.js copies would otherwise run too.
pathIgnorePatterns = ["**/dist/**"]
