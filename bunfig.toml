[install]
# Only install package versions published at least 3 days ago
minimumReleaseAge = 259200 # seconds - in #23162 it'll allow "3d" too
minimumReleaseAgeExcludes = [
  "@pob/root",
  "@pob/esbuild",
  "@pob/rollup",
  "@pob/rollup-esbuild",
  "@pob/rollup-typescript",
  "@pob/sort-object",
  "@pob/sort-pkg",
  "@pob/version",
  "pob-dependencies",
  "pob-dependencies",
  "alouette",
  "alouette-icons",
  "nightingale",
  "nightingale-logger",
]

[test]
# Every test lives in packages/*/src; dist holds committed build output whose
# stale *.test.js copies would otherwise run as duplicates.
pathIgnorePatterns = ["**/dist/**"]
