# Generated by pob: do not edit, it is overwritten on each pob run.
[install]
# Only install package versions published at least 2.5 days ago
minimumReleaseAge = 216000 # seconds
minimumReleaseAgeExcludes = [
  "@pob/root",
  "@pob/esbuild",
  "@pob/rollup",
  "@pob/rollup-esbuild",
  "@pob/rollup-typescript",
  "@pob/sort-object",
  "@pob/sort-pkg",
  "@pob/version",
  "pob-dependencies",
  "alouette",
  "alouette-icons",
  "nightingale",
  "nightingale-logger",
  "nightingale-levels",
  "nightingale-types",
]

[test]
# Every test lives in packages/*/src; dist is gitignored build output that a
# local `bun run build` leaves in place, and its *.test.js copies would
# otherwise run as duplicates.
pathIgnorePatterns = ["**/dist/**"]
