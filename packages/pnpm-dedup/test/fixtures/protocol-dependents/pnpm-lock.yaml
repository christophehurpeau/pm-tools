lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      app:
        specifier: 1.0.0
        version: 1.0.0
      helper:
        specifier: workspace:*
        version: link:packages/helper
      semver:
        specifier: latest
        version: 7.8.1
      picocolors:
        specifier: catalog:default
        version: 1.1.1
      left-pad:
        specifier: file:../left-pad
        version: file:../left-pad
      kleur:
        specifier: link:../kleur
        version: link:../kleur
      chalk:
        specifier: someproto:whatever
        version: 5.6.2

  packages/helper: {}

packages:

  app@1.0.0:
    resolution: {integrity: sha512-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa==}

  picocolors@1.1.1:
    resolution: {integrity: sha512-dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd==}

  semver@7.8.1:
    resolution: {integrity: sha512-cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc==}

snapshots:

  app@1.0.0:
    dependencies:
      semver: 7.8.1

  picocolors@1.1.1: {}

  semver@7.8.1: {}
